<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Delta Force · Team WP – Hướng dẫn tân binh</title>
    <meta name="description" content="Lộ trình 7 ngày cho người mới chơi Delta Force: kiến thức cơ bản, bản đồ, operator, tips thực chiến, nhật ký raid và máy tính loadout." />
    <meta name="theme-color" content="#15212A" />
    <meta property="og:title" content="Delta Force · Team WP – Hướng dẫn tân binh" />
    <meta property="og:description" content="Lộ trình 7 ngày, tips và công cụ cho tân binh Delta Force." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("df-theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app bundle fails to load (network, stale cache), show a way out instead of a blank page.
      (function () {
        function show() {
          var root = document.getElementById("root");
          if (!root || root.childElementCount) return;
          root.innerHTML =
            '<div style="max-width:32rem;margin:15vh auto;padding:0 1rem;font-family:system-ui,sans-serif;color:var(--ink,#1c2a33)">' +
            '<h1 style="font-size:1.6rem;margin:0 0 .5rem">Trang chưa tải được</h1>' +
            '<p style="margin:0 0 1rem;line-height:1.6">Có thể trang vừa được cập nhật. Tải lại hoàn toàn bằng <b>Ctrl+Shift+R</b> (Mac: <b>Cmd+Shift+R</b>). Tiến độ của bạn vẫn được giữ nguyên.</p>' +
            '<button onclick="location.reload()" style="font:inherit;font-weight:600;padding:.55rem 1.1rem;border:2px solid #1c2a33;background:#f2a900;cursor:pointer">Tải lại</button></div>';
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && (t.tagName === "SCRIPT" || (t.tagName === "LINK" && t.rel === "modulepreload"))) setTimeout(show, 300);
        }, true);
        window.addEventListener("load", function () { setTimeout(show, 4000); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
